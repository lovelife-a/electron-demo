name: E2E · Playwright + Electron

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: 端到端测试（Windows）
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci
        env:
          # 只测 Electron，不需要 Playwright 的浏览器内核，省两分钟下载
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: 跑端到端测试
        run: npx playwright test

      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
