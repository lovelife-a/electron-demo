<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Electron 最小示例</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      background: #f8fafc; color: #1e293b; padding: 32px 40px; line-height: 1.6;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #64748b; margin-bottom: 24px; }
    .card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
      padding: 18px 20px; margin-bottom: 14px;
    }
    .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: #0f172a; }
    button {
      font: inherit; font-size: 13px; padding: 7px 16px; border-radius: 7px;
      border: 1px solid #cbd5e1; background: #fff; color: #1e293b; cursor: pointer;
    }
    button:hover { background: #f1f5f9; }
    button.primary { background: #1e3a5f; border-color: #1e3a5f; color: #fff; }
    button.primary:hover { background: #2c3e66; }
    input {
      font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 7px;
      border: 1px solid #cbd5e1; width: 320px; margin-right: 8px;
    }
    .out {
      margin-top: 10px; padding: 10px 12px; background: #f8fafc;
      border: 1px dashed #cbd5e1; border-radius: 7px;
      font-family: Consolas, 'Courier New', monospace; font-size: 12.5px;
      white-space: pre-wrap; min-height: 40px; color: #334155;
    }
    .tip { font-size: 12px; color: #94a3b8; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Electron 最小示例</h1>
  <p class="sub">这个页面跑在 Chromium 里，但它现在能读文件、读系统时间 —— 因为它外面套了 Node.js。</p>

  <div class="card">
    <h2>能力 1 · 读系统时间（主进程算好再给页面）</h2>
    <button class="primary" onclick="showTime()">window.api.getTime()</button>
    <div class="out" id="out1">还没调用</div>
    <p class="tip">这条链路：页面 JS → preload 的 window.api → ipcRenderer.invoke → ipcMain.handle</p>
  </div>

  <div class="card">
    <h2>能力 2 · 写文件（纯网页绝对做不到）</h2>
    <input id="note" placeholder="随便输入点什么，回车写入">
    <button class="primary" onclick="saveNote()">写入</button>
    <div class="out" id="out2">还没写入</div>
  </div>

  <div class="card">
    <h2>能力 3 · 读文件</h2>
    <button onclick="loadNote()">读取笔记</button>
    <div class="out" id="out3">还没读取</div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id)

    async function showTime() {
      try {
        $('out1').textContent = '主进程返回：' + (await window.api.getTime())
      } catch (e) {
        $('out1').textContent = '出错了：' + e.message
      }
    }

    async function saveNote() {
      const text = $('note').value.trim()
      if (!text) { $('out2').textContent = '先输入内容'; return }
      const r = await window.api.writeNote(text)
      $('out2').textContent = r.ok ? '已写入：' + r.file : '写入失败'
      $('note').value = ''
    }

    async function loadNote() {
      const content = await window.api.readNote()
      $('out3').textContent = content ? content.trim() : '（文件是空的，先写点什么）'
    }

    $('note').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveNote()
    })
  </script>
</body>
</html>
